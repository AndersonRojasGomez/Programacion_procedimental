<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css"/>
      <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <title>Iniciar sesión</title>
  </head>
  <body>
    <a href="usuario.html">
    <div class="control">
      <button class="button is-primary">Regresar</button>
    </div>
    <p><font size="5">Iniciar sesión</font></p>
    <div class="field">
  <p class="control has-icons-left has-icons-right">
    <input class="input" type="email" id="email" placeholder="Mail">
    <span class="icon is-small is-left">
      <i class="fas fa-envelope"></i>
    </span>
    <span class="icon is-small is-right">
      <i class="fas fa-check"></i>
    </span>
  </p>
</div>
<div class="field">
  <p class="control has-icons-left">
    <input class="input" type="password" id="password" placeholder="Contraseña">
    <span class="icon is-small is-left">
      <i class="fas fa-lock"></i>
    </span>
  </p>
</div>
<div class="field">
  <p class="control">
    <button class="button is-success">
      Iniciar Sesión
    </button>
  </p>
</div>
  </body>
</html>
