<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <title>Pedidos</title>
    <style>
        .page-margin {
            padding: 3rem 1.5rem;
        }

        .order-box {
            border: 2px solid #4a4a4a;
            padding: 2rem;
            background-color: #ffffff;
            border-radius: 8px;
            max-width: 800px;
            margin: 0 auto;
        }
    </style>
</head>
<body class="has-background-light" style="min-height: 100vh;">
    <div class="container pt-4 px-4">
        <div class="control">
            <a href="http://127.0.0.1:5500/Restaurante%20-%20Anderson%20Rojas/index.html" class="button is-primary">
                Regresar
            </a>
        </div>
    </div>
    <div class="page-margin">
        <div class="order-box">
            <h2 class="title is-4 has-text-centered mb-5">REGISTRO DE PEDIDO</h2>
            <div class="columns is-multiline">
                <div class="column is-6">
                    <div class="field">
                        <label class="label">Nombre del Usuario</label>
                        <div class="control">
                            <input id="ped-nombre-usuario" class="input" type="text" placeholder="Ej. Juan Pérez">
                        </div>
                    </div>
                </div>
                <div class="column is-6">
                    <div class="field">
                        <label class="label">Teléfono</label>
                        <div class="control">
                            <input id="ped-telefono" class="input" type="tel" placeholder="Ej. 3001234567">
                        </div>
                    </div>
                </div>
                <div class="column is-8">
                    <div class="field">
                        <label class="label">Producto</label>
                        <div class="control">
                            <div class="select is-fullwidth">
                                <select id="ped-producto">
                                    <option value="">Selecciona un producto</option>
                                    <option value="Producto A">Lasagna</option>
                                    <option value="Producto B">Quesadilla</option>
                                    <option value="Producto C">Sopa</option>
                                    <option value="Producto D">Pizza</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="column is-4">
                    <div class="field">
                        <label class="label">Cantidad</label>
                        <div class="control">
                            <input id="ped-cantidad" class="input" type="number" min="1" value="1">
                        </div>
                    </div>
                </div>
                <div class="column is-12">
                    <div class="field">
                        <label class="label">Dirección de Entrega</label>
                        <div class="control">
                            <input id="ped-direccion" class="input" type="text" placeholder="Calle, Carrera, Ciudad...">
                        </div>
                    </div>
                </div>
                <div class="column is-12">
                    <div class="field">
                        <label class="label">Método de Pago</label>
                        <div class="control">
                            <label class="radio">
                                <input type="radio" name="pago" value="Efectivo" checked>
                            </label>
                            Efectivo
                            <label class="radio">
                                <input type="radio" name="pago" value="Transferencia">
                            </label>
                            Transferencia
                            <label class="radio">
                                <input type="radio" name="pago" value="Tarjeta">
                                Tarjeta
                            </label>
                        </div>
                    </div>
                </div>
                <div class="column is-12">
                    <div class="field mt-4">
                        <div class="control">
                            <button id="btn-procesar-pedido" class="button is-dark is-fullwidth">PROCESAR PEDIDO</button>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
    <script src="../JS/pedidos.js"></script>
</body>
</html>
