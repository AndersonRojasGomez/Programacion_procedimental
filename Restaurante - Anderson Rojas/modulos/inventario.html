<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <title>Inventario</title>
  </head>
  <body>
    <div class="control m-4">
      <a href="http://127.0.0.1:5500/Restaurante%20-%20Anderson%20Rojas/index.html" class="button is-primary" id="btn-regresar">
        Regresar
      </a>
    </div>

    <div class="container p-4">
      <h1 class="title is-4">Inventario del restaurante</h1>
      
      <div class="control mb-3">
        <input
          id="inv-id-producto"
          class="input"
          type="text"
          placeholder="Escriba acá el ID del producto"
        />
      </div>
      
      <div class="control mb-3">
        <input
          id="inv-nombre-producto"
          class="input"
          type="text"
          placeholder="Escriba acá el nombre del producto"
        />
      </div>
      
      <div class="control mb-3">
        <input
          id="inv-codigo-producto"
          class="input"
          type="text"
          placeholder="Escriba acá el código del producto"
        />
      </div>
      
      <div class="control mb-3">
        <input
          id="inv-marca-producto"
          class="input"
          type="text"
          placeholder="Escriba acá la marca del producto"
        />
      </div>
      
      <div class="control mb-3">
        <div class="select">
          <select id="inv-cantidad-producto">
            <option value="">Seleccione la cantidad del producto</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8+">8 o más</option>
          </select>
        </div>
      </div>
    </div>
    <script src="../JS/inventario.js"></script>
  </body>
</html>
