<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contabilidad</title>
    <!-- Usando la versión más reciente que tenías en tu código -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css"
    />
    <style>
      /* Estilos unificados para el aspecto de "rectángulo trazado" */
      .main-wrapper {
        padding: 40px; /* Espacio entre los extremos de la página y los rectángulos */
      }
      .outline-rect {
        border: 2px solid #4a4a4a;
        padding: 1.5rem;
        margin-bottom: 2rem;
        background-color: transparent;
      }
      .header-flat {
        background-color: #f5f5f5;
      }
      .profile-circle-flat {
        width: 150px;
        height: 150px;
        border-radius: 50%;
        border: 2px solid #4a4a4a;
        margin: 0 auto 20px auto;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #fafafa;
      }
      .profile-circle-flat img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .name-rect-flat {
        border: 2px solid #4a4a4a;
        padding: 10px;
        text-align: center;
        font-weight: bold;
        background-color: #fafafa;
        color: #4a4a4a;
      }
      .inner-content-rect {
        border: 2px solid #4a4a4a;
        padding: 2rem;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <!-- Botón Regresar (Cerrado correctamente para no romper el flujo) -->
    <div class="main-wrapper pb-0">
      <div class="control">
        <a
          href="http://127.0.0.1:5500/Restaurante%20-%20Anderson%20Rojas/index.html"
          class="button is-primary"
        >
          Regresar
        </a>
      </div>
    </div>

    <div class="main-wrapper">
      <!-- Bloque de Encabezado -->
      <div class="outline-rect header-flat">
        <h1 class="title is-3 has-text-centered is-marginless">CONTABILIDAD</h1>
      </div>

      <!-- Bloque de Contenido Principal -->
      <div class="outline-rect">
        <div class="columns">
          <!-- Columna Izquierda: Perfil (30%) -->
          <div class="column is-4">
            <div class="p-4">
              <div class="profile-circle-flat">
                <img
                  src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSDjhE-ufCalGusRGkvx1YLZkx8F-pE6U9DXQ&s"
                  alt="Avatar"
                />
              </div>
              <div class="name-rect-flat">USUARIO</div>
            </div>
          </div>

          <!-- Columna Derecha: Formulario (70%) -->
          <div class="column is-8">
            <div class="p-4">
              <div class="inner-content-rect">
                <div class="columns is-multiline">
                  <!-- Ventas -->
                  <div class="column is-6">
                    <div class="field">
                      <label class="label">Ventas</label>
                      <div class="control">
                        <input
                          id="ventas"
                          class="input"
                          type="text"
                          placeholder="Ingresa ventas..."
                        />
                      </div>
                    </div>
                  </div>

                  <!-- Fecha -->
                  <div class="column is-6">
                    <div class="field">
                      <label class="label">Fecha</label>
                      <div class="control">
                        <input id="fecha" class="input" type="date" />
                      </div>
                    </div>
                  </div>

                  <!-- Ingresos -->
                  <div class="column is-6">
                    <div class="field">
                      <label class="label">Ingresos</label>
                      <div class="control">
                        <input
                          id="ingresos"
                          class="input"
                          type="number"
                          placeholder="0.00"
                        />
                      </div>
                    </div>
                  </div>

                  <!-- Egresos -->
                  <div class="column is-6">
                    <div class="field">
                      <label class="label">Egresos</label>
                      <div class="control">
                        <input
                          id="egresos"
                          class="input"
                          type="number"
                          placeholder="0.00"
                        />
                      </div>
                    </div>
                  </div>

                  <!-- Concepto -->
                  <div class="column is-12">
                    <div class="field">
                      <label class="label">Concepto</label>
                      <div class="control">
                        <input
                          id="concepto"
                          class="input"
                          type="text"
                          placeholder="Escribe el concepto aquí"
                        />
                      </div>
                    </div>
                  </div>

                  <!-- Valor -->
                  <div class="column is-12">
                    <div class="field">
                      <label class="label">Valor</label>
                      <div class="control">
                        <input
                          id="valor"
                          class="input is-link"
                          type="number"
                          placeholder="Valor final"
                        />
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="../JS/contabilidad.js"></script>
  </body>
</html>
